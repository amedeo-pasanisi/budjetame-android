# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use parallel builds and configuration cache for faster builds
org.gradle.parallel=true
org.gradle.configuration-cache=true

# AndroidX is required (and the default) since AGP 9
android.useAndroidX=true

# Generate non-transitive R classes per module (default in AGP 9)
android.nonTransitiveRClass=true
